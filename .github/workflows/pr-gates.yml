# CI for jotter. Runs on every PR to main (and on main itself, so main stays green).
# Each job shows up as its own check on the PR; branch protection requires them.
#   quality:  lint, types, test (coverage >= 90%), docker build + smoke test
#   security: secrets (gitleaks), sast (semgrep), deps (pip-audit + licences), image scan (trivy + SBOM)
name: pr-gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read # read-only token; no job here needs to write

concurrency:
  # a new push to the same PR cancels the previous, now outdated, run
  group: pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked # fails if uv.lock is out of date with pyproject.toml
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: types (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov=jotter --cov-report=term-missing --cov-fail-under=90

  docker:
    name: docker (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jotter:ci .
      - name: Start container
        run: docker run -d --name jotter -p 8000:8000 jotter:ci
      - name: Home page responds
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ | grep -q "Your ideas"; then
              echo "jotter is up"; exit 0
            fi
            sleep 1
          done
          echo "jotter did not start in time"; docker logs jotter; exit 1
      - name: Container logs
        if: always()
        run: docker logs jotter || true

  # ---------------------------------------------------------------- security gates

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: scan every commit in the PR, not just the last one
      - uses: gitleaks/gitleaks-action@v2 # free for personal accounts; orgs need a licence key
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep # official image; semgrep isn't supported on Windows, so CI is where it runs
    steps:
      - uses: actions/checkout@v4
      # p/python: Python security + correctness rules (SQL injection, unsafe deserialisation, …)
      - run: semgrep scan --config p/python --error --metrics=off

  deps:
    name: deps (pip-audit + licences)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Known vulnerabilities in locked dependencies
        run: |
          uv export --frozen --format requirements-txt --no-emit-project -o audit-requirements.txt
          uvx pip-audit -r audit-requirements.txt --require-hashes --disable-pip --progress-spinner off
      - name: Licences of runtime dependencies (no GPL family)
        run: |
          uv sync --locked --no-dev
          uv run --no-sync --with pip-licenses pip-licenses --from=mixed --order=license --format=markdown
          uv run --no-sync --with pip-licenses pip-licenses --from=mixed --partial-match --fail-on="GPL"

  image-scan:
    name: image scan (trivy + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jotter:ci .
      - name: Scan image for HIGH/CRITICAL vulnerabilities (OS packages + Python libraries)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jotter:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only fail on problems that have a fix available
          exit-code: "1"
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: jotter:ci
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true # trivy is already installed by the step above
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
