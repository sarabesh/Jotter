[project]
name = "jotter"
version = "0.4.0"
description = "A tiny web app for capturing ideas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jotter"]
